<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Library</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Library">
<meta name="theme-color" content="#e9eef0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141b20" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#e9eef0;--ink:#1d2a33;--mut:#5b6b75;--card:#fff;--wood:#6b4a32;--acc:#0f6b6f;--hot:#c0392b;--line:#cdd6db;--nav:64px;--sb:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#141b20;--ink:#e6edf0;--mut:#93a3ad;--card:#1c262d;--wood:#8a6444;--acc:#2f8f94;--line:#2c3a43}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding-bottom:calc(6rem + var(--sb))}
h1,h2,h3{font-family:"Iowan Old Style",Palatino,Georgia,serif;margin:0;line-height:1.2}
h3{margin-top:1.75rem;font-size:1.2rem}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:.5rem;padding:calc(.6rem + env(safe-area-inset-top,0px)) 1rem .6rem;max-width:900px;margin:auto}
header h1{flex:1;min-width:0;font-size:clamp(1.3rem,5.5vw,2rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header select{width:auto;max-width:9rem}
nav{display:flex;gap:.5rem;padding:0 1rem;max-width:900px;margin:auto}
nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;margin-right:.3rem}
main{padding:1rem;max-width:900px;margin:auto}
a{color:var(--acc);text-underline-offset:2px}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.5rem .9rem;min-height:44px;cursor:pointer;touch-action:manipulation}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.wide{width:100%}
button.danger{color:var(--hot)}
nav button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin:.75rem 0}
.row button{white-space:nowrap}
.wrap{flex-wrap:wrap;justify-content:flex-start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.mut{color:var(--mut);font-size:.9rem}
.list>button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:.5rem;padding:.9rem;min-height:56px}
.list>button::after{content:"›";font-size:1.4rem;color:var(--mut);margin-left:.5rem}
.item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.4rem .4rem .4rem .9rem;margin:.5rem 0}
.tag{font-size:.75rem;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:.05rem .5rem;margin-left:.4rem;color:var(--mut);font-family:system-ui,sans-serif;font-weight:normal;vertical-align:middle}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:.75rem;padding:1rem .75rem 0;border-bottom:14px solid var(--wood);margin:.75rem 0 1.5rem}
.book{cursor:pointer;font-size:.8rem;line-height:1.25;padding-bottom:.6rem;min-width:0}
.book b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.book img,.ph{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:2px 4px 4px 2px;background:var(--line);box-shadow:2px 3px 6px #0004;padding:.4rem;text-align:center;font-family:Palatino,Georgia,serif;margin-bottom:.3rem;overflow:hidden}
.hot{color:var(--hot)}
dialog{border:0;border-radius:12px;background:var(--card);color:var(--ink);width:min(94vw,460px);padding:1.25rem 1.25rem 0;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain}
dialog::backdrop{background:#0008}
dialog h2{padding-right:1rem}
.acts{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);margin:1rem -1.25rem 0;padding:.75rem 1.25rem calc(.75rem + var(--sb))}
label{display:block;margin:.75rem 0 .2rem;font-size:.85rem;color:var(--mut)}
label.check{display:flex;align-items:center;min-height:44px;font-size:1rem;color:var(--ink)}
input,select,textarea{width:100%;padding:.6rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:44px}
input[type=checkbox]{width:1.3rem;height:1.3rem;min-height:0;margin:0 .6rem 0 0}
input[type=file]{padding:.5rem}
.rate{display:flex;gap:.1rem}
.rate button{font-size:1.6rem;line-height:1;min-width:44px;padding:0;background:none;border:0;filter:grayscale(1);opacity:.35}
.rate button.on{filter:none;opacity:1}
.star.on{color:#e0a100}
.fab{position:fixed;right:1rem;bottom:calc(1rem + var(--sb));border-radius:99px;padding:.8rem 1.3rem;box-shadow:0 4px 12px #0005;z-index:4}
#reader video{border-radius:8px}
#warn{max-width:900px;margin:.5rem auto 0;padding:0 1rem}#warn .note{margin:0;font-size:.95rem}
.note.tip{border-left-color:var(--acc)}
.arranging .book{cursor:grab;outline:2px dashed var(--line);outline-offset:3px;border-radius:4px;user-select:none;-webkit-user-select:none}
.ghost{opacity:.35}
.arrbar{position:fixed;left:0;right:0;bottom:calc(1rem + var(--sb));z-index:7;display:flex;justify-content:center;gap:.75rem;pointer-events:none}
.arrbar button{pointer-events:auto;min-width:7rem;box-shadow:0 4px 12px #0005}
.is-arranging .fab{display:none}
@media(max-width:699px){.arrbar{bottom:calc(var(--nav) + .75rem + var(--sb))}}
.mv{display:flex;justify-content:space-between;margin-bottom:.25rem}.mv button{min-height:36px;min-width:40px;padding:0}
.groups{list-style:none;padding:0;margin:.5rem 0}.groups li{border-bottom:1px solid var(--line);padding:.5rem 0}
#gate[hidden]{display:none}
#gate{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem}
#gate form{width:min(100%,360px)}#gate h1{margin:.5rem 0 .25rem}
body.gated>*:not(#gate){display:none!important}
.note{background:var(--bg);border-left:4px solid var(--hot);border-radius:6px;padding:.6rem .8rem;margin:.75rem 0;font-size:.9rem}
.results>button{display:flex;gap:.75rem;align-items:center;width:100%;text-align:left;margin:.4rem 0;padding:.5rem}
.thumb{width:44px;aspect-ratio:2/3;object-fit:cover;flex:none;border-radius:2px;background:var(--line)}
.info{display:flex;gap:1rem;align-items:flex-start;margin:.5rem 0}
.info img{width:88px;aspect-ratio:2/3;object-fit:cover;flex:none;border-radius:2px 4px 4px 2px;box-shadow:2px 3px 6px #0004}
.info b{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:1.25rem;line-height:1.2}
.tags{display:flex;flex-wrap:wrap;gap:.3rem;margin:.5rem 0}.tags .tag{margin:0}
.desc{white-space:pre-line;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;margin:.5rem 0;cursor:pointer}
.desc.open{display:block}
details{margin-top:1rem;border-top:1px solid var(--line);padding-top:.5rem}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--acc)}
#toast{position:fixed;left:1rem;right:1rem;bottom:calc(5rem + var(--sb));max-width:420px;margin:auto;background:var(--ink);color:var(--bg);border-radius:10px;padding:.75rem 1rem;box-shadow:0 4px 16px #0006;z-index:10;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#toast.err{background:var(--hot);color:#fff}
@media(max-width:699px){
  body{padding-bottom:calc(var(--nav) + 5.5rem + var(--sb))}
  #lock .lbl{display:none}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:0 0 var(--sb);background:var(--card);border-top:1px solid var(--line);max-width:none}
  nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:0;background:none;min-height:var(--nav);font-size:.72rem;color:var(--mut)}
  nav button[aria-pressed=true]{background:none;color:var(--acc);font-weight:600}
  nav svg{width:24px;height:24px;margin:0}
  .fab{bottom:calc(var(--nav) + .75rem + var(--sb))}
  #toast{bottom:calc(var(--nav) + 4.5rem + var(--sb))}
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:16px 16px 0 0;max-height:92dvh;padding:1.25rem 1rem 0}
  .acts{margin:1rem -1rem 0;padding:.75rem 1rem calc(.75rem + var(--sb))}
}
</style></head><body>
<div id="gate" hidden><form onsubmit="event.preventDefault();gateSubmit()">
<img src="/static/icon-192.png" alt="" width="72" height="72">
<h1>Home Library</h1><p id="gateMsg" class="mut"></p>
<label for="gu">Username</label><input id="gu" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
<label for="gp">Password</label><input id="gp" type="password" autocomplete="current-password" required>
<div id="gp2w" hidden><label for="gp2">Password again</label><input id="gp2" type="password" autocomplete="new-password"></div>
<p id="gateErr" class="note" role="alert" hidden></p>
<button class="p wide" id="gateBtn" style="margin-top:1.25rem">Log in</button>
</form></div>
<header><h1>Home Library</h1>
<select id="who" aria-label="Whose books to show" onchange="setPerson(this.value)" hidden></select>
<button id="lock" onclick="lockBtn()"></button></header>
<nav aria-label="Sections">
<button data-t="shelves" onclick="go('shelves')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 5.5l3.5-1 3 14.5-3.5 1z"/></svg>Shelves</button>
<button data-t="wish" onclick="go('wish')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Wish list</button>
<button data-t="search" onclick="go('search')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5a6 6 0 1 0 0 12a6 6 0 1 0 0-12zM16 16l4 4"/></svg>Search</button>
<button data-t="settings" onclick="go('settings')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9m4 0h3M4 17h3m4 0h9M15 5v4M9 15v4"/></svg>Settings</button>
</nav>
<div id="warn" role="alert" hidden></div>
<main></main>
<button class="p fab" onclick="openAdd()">+ Add book</button>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="add" aria-labelledby="addT"><h2 id="addT">Add book</h2>
<button class="p wide" onclick="scan()" style="margin-top:1rem">📷 Scan barcode</button><div id="reader" style="margin-top:.5rem"></div>
<label for="isbn">Or type an ISBN, or a title and author</label>
<div class="row" style="margin:0"><input id="isbn" type="search" enterkeyhint="search" autocomplete="off" onkeydown="if(event.key==='Enter')findBook()"><button onclick="findBook()">Find</button></div>
<div id="results" class="results"></div><div id="preview"></div>
<label for="t">Title</label><input id="t" autocapitalize="words" enterkeyhint="next">
<label for="a">Author</label><input id="a" autocapitalize="words" enterkeyhint="next">
<label for="sh">Shelf</label><select id="sh"></select>
<label for="ap">Whose book</label><select id="ap"></select>
<div class="row acts"><button onclick="this.closest('dialog').close()">Cancel</button><button class="p" onclick="saveNew()">Add book</button></div>
</dialog>

<dialog id="ed" aria-label="Book"><div id="einfo"></div>
<div class="two"><div><label for="esh">Shelf</label><select id="esh"></select></div><div><label for="epp">Whose book</label><select id="epp"></select></div></div>
<label id="erL">Rating</label><div class="rate" id="er" role="group" aria-labelledby="erL"></div>
<label id="esL">Spicy rating</label><div class="rate" id="es" role="group" aria-labelledby="esL"></div>
<label for="ev">Review</label><textarea id="ev" rows="4"></textarea>
<div class="two"><div><label for="el">AR level</label><input id="el" type="number" inputmode="decimal" step="0.1" min="0"></div><div><label for="ep">AR points</label><input id="ep" type="number" inputmode="decimal" step="0.5" min="0"></div></div>
<label class="check"><input id="ex" type="checkbox">Restricted section</label>
<details id="edet"><summary>Edit book details</summary>
<label for="dt">Title</label><input id="dt" autocapitalize="words">
<label for="dst">Subtitle</label><input id="dst">
<label for="da">Author</label><input id="da" autocapitalize="words">
<div class="two"><div><label for="dse">Series</label><input id="dse" autocapitalize="words"></div><div><label for="dsi">Number in series</label><input id="dsi" type="number" inputmode="decimal" step="0.5" min="0"></div></div>
<div class="two"><div><label for="dpu">Publisher</label><input id="dpu"></div><div><label for="dpd">Published</label><input id="dpd"></div></div>
<div class="two"><div><label for="dpg">Pages</label><input id="dpg" type="number" inputmode="numeric" min="1"></div><div><label for="dis">ISBN</label><input id="dis" inputmode="numeric"></div></div>
<label for="dsu">Subjects (separate with commas)</label><input id="dsu">
<label for="dco">Cover image address</label><input id="dco" type="url" inputmode="url">
<label for="dde">Description</label><textarea id="dde" rows="5"></textarea>
<button id="dfill" onclick="fillBook()" style="margin-top:.75rem">Fill in missing details</button>
</details>
<div class="row acts"><button class="danger" onclick="del()">Delete</button><span style="flex:1"></span><button onclick="this.closest('dialog').close()">Cancel</button><button class="p" onclick="saveEdit()">Save</button></div>
</dialog>

<dialog id="sd" aria-labelledby="sdt"><h2 id="sdt">New shelf</h2>
<label for="sn">Name</label><input id="sn" autocapitalize="words" enterkeyhint="done">
<label for="so">Belongs to</label><select id="so"></select>
<div class="row acts"><button id="sdx" class="danger" onclick="delShelf()">Delete</button><span style="flex:1"></span><button onclick="this.closest('dialog').close()">Cancel</button><button class="p" onclick="saveShelf()">Save</button></div>
</dialog>

<dialog id="org" aria-labelledby="orgT"><h2 id="orgT">Organize shelves</h2>
<p class="mut">The app puts your books onto shelves by a rule. You'll see the result before anything moves. Wish list books aren't touched, and a backup is saved first.</p>
<label for="orule">Put books on shelves by</label>
<select id="orule" onchange="orgPreview()"><option value="genre">Genre (subjects books share)</option><option value="author">Author's last name (A–C, D–F…)</option><option value="series">Series</option><option value="level">Reading level (AR)</option><option value="person">Whose book it is</option></select>
<label for="operson">Which books</label><select id="operson" onchange="orgPreview()"></select>
<label for="omin">Smallest shelf</label><select id="omin" onchange="orgPreview()"><option value="1">1 book</option><option value="2">2 books</option><option value="3" selected>3 books</option><option value="5">5 books</option><option value="10">10 books</option></select>
<p class="mut" style="margin:.25rem 0">Groups smaller than this share one "Other" shelf.</p>
<div id="oprev" aria-live="polite"></div>
<div class="row acts"><button onclick="this.closest('dialog').close()">Cancel</button><button class="p" id="ogo" onclick="orgApply()">Organize</button></div>
</dialog>

<dialog id="ud" aria-labelledby="udT"><h2 id="udT"></h2>
<div id="udNameW"><label for="udName">Username</label><input id="udName" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off"></div>
<label for="udPw" id="udPwL">Password</label><input id="udPw" type="password" autocomplete="new-password">
<label for="udRole">Account type</label><select id="udRole"><option value="member">Member: uses the library</option><option value="admin">Owner: also manages accounts, keys and backups</option></select>
<label for="udPerson">Starts out showing the books of</label><select id="udPerson"></select>
<div class="row acts"><button id="udDel" class="danger" onclick="removeUser()">Remove</button><span style="flex:1"></span><button onclick="this.closest('dialog').close()">Cancel</button><button class="p" onclick="saveUser()">Save</button></div>
</dialog>

<dialog id="ask" aria-labelledby="askT"><form method="dialog"><h2 id="askT"></h2>
<label for="askI" id="askL"></label><input id="askI" autocomplete="off">
<div class="row acts"><button type="button" onclick="this.closest('dialog').close()">Cancel</button><button class="p" value="ok" id="askOk">OK</button></div>
</form></dialog>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const store={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let arranging=false,tab='shelves',shelf=null,sort='title',shelves=[],people=[],person=store.get('person'),tok=store.get('tok'),editing=null,editingShelf=null,lastQ='',scanner=null,findTimer=0,found={},results=[];
const open=()=>tok&&+tok.split('.')[0]>Date.now()/1000;
const setTok=t=>{tok=t;store.set('tok',t)};
async function api(p,o={}){
  const r=await fetch('/api'+p,{method:o.method||'GET',headers:{'Content-Type':'application/json','X-Unlock':open()?tok:''},body:o.body?JSON.stringify(o.body):undefined});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&me){me=null;$('main').innerHTML='';showGate('login')}
  if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'Something went wrong');
  return d}
let toastTimer=0;
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='show'+(err?' err':'');t.setAttribute('role',err?'alert':'status');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='',err?5000:3000)}
const fail=e=>toast(e.message,true);
function ask({title,label,value='',pin=false,password=false,ok='OK'}){
  const d=$('#ask'),i=$('#askI');
  $('#askT').textContent=title;$('#askL').textContent=label;$('#askOk').textContent=ok;
  i.type=pin||password?'password':'text';i.inputMode=pin?'numeric':'text';i.autocapitalize=pin||password?'off':'words';i.value=value;
  d.returnValue='';d.showModal();i.focus();
  return new Promise(res=>d.addEventListener('close',()=>res(d.returnValue==='ok'?i.value:null),{once:true}))}
const go=t=>{tab=t;shelf=null;arranging=false;render();scrollTo(0,0)};
const pq=(pre='?')=>person?pre+'person_id='+person:'';
const setPerson=v=>{person=v;store.set('person',v);shelf=null;render()};
const byTitle=(x,y)=>x.title.localeCompare(y.title);
const SORTS={title:byTitle,author:(x,y)=>x.authors.localeCompare(y.authors)||byTitle(x,y),
  series:(x,y)=>(!x.series)-(!y.series)||x.series.localeCompare(y.series)||(x.series_index??0)-(y.series_index??0)||byTitle(x,y),
  added:(x,y)=>y.id-x.id,
  custom:(x,y)=>(x.position==null)-(y.position==null)||(x.position??0)-(y.position??0)||byTitle(x,y)};
const sorted=(a,how=sort)=>[...a].sort(SORTS[how]||byTitle);
const SORT_NAMES=[['custom','My order'],['title','Title'],['author','Author'],['series','Series'],['added','Newest']];
const seriesText=b=>b.series?b.series+(b.series_index!=null?' #'+b.series_index:''):'';
function infoHtml(b){
  const facts=[b.publisher,b.published,b.pages?b.pages+' pages':''].filter(Boolean).join(' · ');
  return `<div class="info">${b.cover?`<img src="${esc(b.cover)}" alt="">`:''}<div><b>${esc(b.title)}</b>${b.subtitle?`<div>${esc(b.subtitle)}</div>`:''}<div class="mut">${esc(b.authors)}</div>${b.series?`<div class="mut">${esc(seriesText(b))}</div>`:''}${facts?`<div class="mut">${esc(facts)}</div>`:''}</div></div>`}
const opts=sel=>shelves.map(s=>`<option value="${s.id}" ${s.id==sel?'selected':''}>${esc(s.name)}${s.person?' ('+esc(s.person)+')':''}</option>`).join('')+`<option value="w" ${sel==='w'?'selected':''}>Wish list</option>`;
const personOpts=(sel,none)=>`<option value="">${none}</option>`+people.map(p=>`<option value="${p.id}" ${p.id==sel?'selected':''}>${esc(p.name)}</option>`).join('');
const num=v=>v===''?null:+v;

/* Tap-to-rate: tapping the current value again clears it. */
function setRate(id,v){const el=$('#'+id);el.dataset.v=v;el.querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('on',i<v);b.setAttribute('aria-pressed',i<v)})}
function makeRate(id,sym,cls,noun){$('#'+id).innerHTML=[1,2,3,4,5].map(n=>`<button type="button" class="${cls}" aria-label="${n} ${noun}${n>1?'s':''}" onclick="setRate('${id}',${n}==$('#${id}').dataset.v?0:${n})">${sym}</button>`).join('')}
makeRate('er','★','star','star');makeRate('es','🌶','','pepper');

function card(b,showShelf){
  const img=b.cover?`<img src="${esc(b.cover)}" alt="" loading="lazy">`:`<div class="ph">${esc(b.title)}</div>`;
  const mv=arranging?`<span class="mv"><button type="button" aria-label="Move ${esc(b.title)} left" onclick="moveCard(this,-1)">◀</button><button type="button" aria-label="Move ${esc(b.title)} right" onclick="moveCard(this,1)">▶</button></span>`:'';

    const pin=await ask(set?{title:'Restricted section',label:'PIN',pin:true,ok:'Open'}:{title:'Set a PIN',label:'Choose a PIN (4 or more digits) for the restricted section',pin:true,ok:'Save'});
    if(!pin)return;
    setTok((await api(set?'/unlock':'/pin',{method:'POST',body:{pin}})).token);render()
  }catch(e){fail(e)}}
/* Accounts */
let me=null,gateMode='login',accounts=[],editingUser=null;
const isOwner=()=>me?.role==='admin';
function showGate(mode){
  gateMode=mode;document.querySelectorAll('dialog[open]').forEach(d=>d.close());
  document.body.classList.add('gated');$('#gate').hidden=false;$('#gateErr').hidden=true;
  const setup=mode==='setup';
  $('#gateMsg').textContent=setup?'Welcome! Create the owner account first. You can add accounts for everyone else in Settings.':'Log in to your library.';
  $('#gp').autocomplete=setup?'new-password':'current-password';$('#gp2w').hidden=!setup;$('#gp2').required=setup;
  $('#gateBtn').textContent=setup?'Create account':'Log in';$('#gu').focus()}
async function gateSubmit(){
  const err=$('#gateErr'),username=$('#gu').value.trim(),password=$('#gp').value;err.hidden=true;
  if(gateMode==='setup'&&password!==$('#gp2').value){err.textContent='The two passwords don’t match.';err.hidden=false;return}
  $('#gateBtn').disabled=true;
  try{
    const r=await fetch('/api/auth/'+(gateMode==='setup'?'setup':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:'Something went wrong');
    me=d.user;$('#gp').value=$('#gp2').value='';document.body.classList.remove('gated');$('#gate').hidden=true;start()
  }catch(e){err.textContent=e.message;err.hidden=false}finally{$('#gateBtn').disabled=false}}
async function logout(){
  try{await api('/auth/logout',{method:'POST'})}catch(e){}
  me=null;setTok('');tab='shelves';shelf=null;$('main').innerHTML='';$('#gu').value='';showGate('login')}
async function changeMyPassword(){
  const current=await ask({title:'Change password',label:'Current password',password:true,ok:'Next'});if(!current)return;
  const pw=await ask({title:'Change password',label:'New password (8 or more characters)',password:true,ok:'Next'});if(!pw)return;
  const again=await ask({title:'Change password',label:'New password again',password:true,ok:'Save'});if(again===null)return;
  if(pw!==again)return toast('The two new passwords don’t match',true);
  try{await api('/auth/password',{method:'POST',body:{current,password:pw}});toast('Password changed. Your other devices are logged out.')}catch(e){fail(e)}}
function openUser(id){
  const u=accounts.find(x=>x.id===id);editingUser=u||null;
  $('#udT').textContent=u?u.username:'Add account';$('#udNameW').hidden=!!u;$('#udName').value='';$('#udPw').value='';
  $('#udPwL').textContent=u?'Set a new password (leave blank to keep theirs)':'Password (8 or more characters)';
  $('#udRole').value=u?u.role:'member';$('#udPerson').innerHTML=personOpts(u?u.person_id:'','Everyone');
  $('#udDel').hidden=!u||u.id===me.id;$('#ud').showModal()}
async function saveUser(){
  const body={role:$('#udRole').value,person_id:num($('#udPerson').value)},pw=$('#udPw').value;
  try{
    if(editingUser){if(pw)body.password=pw;await api('/users/'+editingUser.id,{method:'PATCH',body});toast(pw?'Saved. They’ll need the new password to log in.':'Saved')}
    else{await api('/users',{method:'POST',body:{...body,username:$('#udName').value.trim(),password:pw}});toast('Account added')}
    $('#ud').close();
    if(editingUser?.id===me.id&&body.role!=='admin')me.role=body.role;
    render()
  }catch(e){fail(e)}}
async function removeUser(){
  if(!confirm(`Remove ${editingUser.username}'s account? Their books and shelves stay.`))return;
  try{await api('/users/'+editingUser.id,{method:'DELETE'});$('#ud').close();toast('Account removed');render()}catch(e){fail(e)}}
let started=false;
function start(){
  // Start out showing the logged-in person's books, unless this device already chose.
  if(!store.get('person')&&me.person_id){person=String(me.person_id);store.set('person',person)}
  render();if(started)return;started=true;
  /* Warn if the library would be wiped the next time the container is replaced. */
  api('/storage').then(r=>{if(r.status!=='temporary')return;const w=$('#warn');w.hidden=false;
  w.innerHTML='<div class="note"><b>Your library isn’t being saved permanently.</b> The app’s data folder is temporary storage, so updating or redeploying the app will erase every book, shelf, person and key. On TrueNAS: Apps → home-library → Edit → Storage, and mount <code>/data</code> from a Host Path on a dataset. Download a backup from Settings first, then restore it afterwards.</div>'}).catch(()=>{})}
(async function boot(){
  try{
    const st=await (await fetch('/api/auth/status')).json();
    if(st.setup_needed)return showGate('setup');
    if(!st.user)return showGate('login');
    me=st.user;start()
  }catch(e){toast('Can’t reach the library server. Check it’s running, then reload.',true)}})();
</script></body></html>
